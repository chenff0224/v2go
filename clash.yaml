port: 7890
socks-port: 7891
allow-lan: true
mode: rule
log-level: info
external-controller: 127.0.0.1:9090

dns:
  enable: true
  ipv6: false
  listen: 0.0.0.0:53
  enhanced-mode: redir-host
  nameserver:
    - 223.5.5.5
    - 119.29.29.29

proxies:

proxy-groups:
  - name: 🚀 自动挑选(YouTube优化)
    type: url-test
    url: https://www.youtube.com/generate_204
    interval: 300
    tolerance: 50
    proxies:
  - name: 🔰 节点选择
    type: select
    proxies:
      - 🚀 自动挑选(YouTube优化)

rules:
  - DOMAIN-SUFFIX,youtube.com,🔰 节点选择
  - DOMAIN-SUFFIX,googlevideo.com,🔰 节点选择
  - DOMAIN-KEYWORD,github,🔰 节点选择
  - DOMAIN-SUFFIX,cn,DIRECT
  - GEOIP,CN,DIRECT
  - MATCH,🔰 节点选择
